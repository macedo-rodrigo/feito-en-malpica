# Netlify picks this up automatically, so connecting the repository is the
# only thing that needs doing by hand.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # Keeps the preview out of search results while the site is unfinished and
  # the directory still carries placeholder phone numbers.
  # Delete this line (and redeploy) on the day it goes public for real.
  PUBLIC_NOINDEX = "true"

# The site uses trailing slashes everywhere. Netlify adds the missing one by
# itself for static pages, but not for the on-demand ones under /admin, where
# the request reaches the function and finds no route - so typing /admin gave
# a 404. These are the two addresses a person types or bookmarks; everything
# deeper is reached by a link, and those all carry the slash.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/admin/entrar"
  to = "/admin/entrar/"
  status = 301

# Long-lived caching for the fingerprinted assets Astro emits. Their names
# change whenever their contents do, so they can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site collects nothing and loads nothing from anywhere else, so it can
# afford to say so.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
