# Netlify picks this up automatically, so connecting the repository is the
# only thing that needs doing by hand.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # Keeps the preview out of search results while the site is unfinished and
  # the directory still carries placeholder phone numbers.
  # Delete this line (and redeploy) on the day it goes public for real.
  PUBLIC_NOINDEX = "true"

# No trailing-slash redirects here. Netlify ignores the trailing slash when
# matching a rule, so `from = "/admin"` catches /admin/ as well and redirects
# it to itself - an infinite loop. The on-demand routes accept both forms
# instead, via `trailingSlash: 'ignore'` in astro.config.mjs.

# Long-lived caching for the fingerprinted assets Astro emits. Their names
# change whenever their contents do, so they can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site collects nothing and loads nothing from anywhere else, so it can
# afford to say so.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
