<!doctype html>
<html lang="gl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Never index the editor, even once the site itself opens up. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor — Feito en Malpica</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Shown only until the editor loads, and left standing if it never does. */
      .boot {
        max-width: 34rem;
        margin: 4rem auto;
        padding: 0 1.5rem;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.6;
        color: #14181a;
      }
      .boot h1 {
        font-size: 1.25rem;
      }
      .boot code {
        background: #f6f3ed;
        padding: 0.1em 0.3em;
      }
      @media (prefers-color-scheme: dark) {
        .boot {
          color: #f6f3ed;
        }
        .boot code {
          background: #2a3136;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot" id="boot">
      <h1>Cargando o editor…</h1>
      <p>
        Se esta mensaxe non desaparece, o editor non puido cargarse: comproba a
        conexión e recarga a páxina. A configuración está en
        <code>public/editor/config.yml</code>.
      </p>
    </div>

    <!--
      Sveltia CMS: a git-based editor. Saving writes a commit to the GitHub
      repository, and the host rebuilds the site from it a minute or two
      later. Pinned to a major version so an upstream release cannot change
      the editor under the people using it.

      This is a plain static file on purpose, not an Astro route. The dev
      server reloads the page whenever a file on disk changes, and the editor
      writes files - it would reload itself mid-save and truncate content.
      Locally it is served by `npm run admin`, which has no file watcher.

      Loaded with a plain src, not an `import`: imported, the bundle runs but
      never mounts.
    -->
    <script
      type="module"
      src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js"
    ></script>

    <!-- Clears the fallback once the editor has actually painted something. -->
    <script>
      const boot = document.getElementById('boot');
      const poll = setInterval(() => {
        if (document.body.children.length > 2) {
          boot?.remove();
          clearInterval(poll);
        }
      }, 200);
      setTimeout(() => clearInterval(poll), 20000);
    </script>
  </body>
</html>
